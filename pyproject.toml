[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timeflight"
version = "0.0.1"
description = "Documentary drone flyovers from open geodata, re-rendered as the place looked in an earlier era (ComfyUI + LTX)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
]

[project.optional-dependencies]
# Driving ComfyUI through the Comfy Developer Platform SDK.
comfy = ["comfy-sdk>=0.5", "comfy-api-proxy>=0.1.6"]
# Go/no-go metrics (Depth-Anything-V2-Small, Apache-2.0).
metrics = ["torch", "transformers>=4.45", "opencv-python-headless>=4.9"]
# Geodata fetch (scripts/fetch_geodata.py): rasterio (BSD-3, bundles GDAL), pyosmium (BSD-2).
geo = ["rasterio>=1.4", "osmium>=4.0"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["timeflight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
